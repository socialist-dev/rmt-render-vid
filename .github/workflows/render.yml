name: Remotion Threads Screenshot Render
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Khuyên dùng bản 20 để Puppeteer chạy ổn định nhất

      - name: 2. Install Dependencies & Chrome
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          # Bước cực kỳ quan trọng: Cài đặt trình duyệt Chrome và các thư viện hệ thống cần thiết cho Puppeteer
          sudo npx puppeteer browsers install chrome --install-deps

      - name: 3. Capture Threads Screenshots
        run: |
          # 1. Ghi dữ liệu từ n8n vào file input.json
          echo '${{ toJson(github.event.client_payload) }}' > input.json
          
          # 2. Tạo thư mục public để chứa ảnh chụp tạm thời
          mkdir -p public
          
          # 3. Chạy script chụp ảnh bài đăng Threads (File capture_threads.js bạn đã tạo)
          node capture_threads.js

      - name: 4. Render Remotion Video
        run: |
          # Ra lệnh cho Remotion render và đọc dữ liệu từ file input.json
          npx remotion render MainVideo out/video.mp4 --props=./input.json

      - name: 5. Upload to Telegram Only
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          python3 -c "
          import requests, os, sys
          
          def run():
              try:
                  token = os.environ.get('TELEGRAM_TOKEN')
                  chat_id = os.environ.get('TELEGRAM_CHAT_ID')
                  title = os.environ.get('TITLE', 'No Title')

                  print(f'--- Đang gửi video đến Chat ID: {chat_id} ---')
                  video_path = 'out/video.mp4'
                  
                  with open(video_path, 'rb') as f:
                      r_tg = requests.post(
                          f'https://api.telegram.org/bot{token}/sendVideo',
                          data={'chat_id': chat_id, 'caption': '🚀 Rendered: ' + title},
                          files={'video': f}
                      )
                  
                  if r_tg.status_code == 200:
                      print('✅ Thành công! Kiểm tra Telegram.')
                  else:
                      print(f'❌ Lỗi Telegram: {r_tg.text}')
                      sys.exit(1)
                      
              except Exception as e:
                  print(f'❌ Lỗi hệ thống: {str(e)}')
                  sys.exit(1)
          run()
          "
