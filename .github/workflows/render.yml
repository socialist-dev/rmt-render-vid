name: Remotion Telegram Test
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 2. Install Dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Render Remotion Video
        run: |
          # Ghi toàn bộ payload từ n8n vào file input.json để tránh lỗi ký tự đặc biệt
          echo '${{ toJson(github.event.client_payload) }}' > input.json
          
          # Ra lệnh cho Remotion render và đọc props từ file
          npx remotion render MainVideo out/video.mp4 --props=./input.json

      - name: 4. Upload to Telegram Only
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          python3 -c "
          import requests, os, sys
          
          def run():
              try:
                  token = os.environ.get('TELEGRAM_TOKEN')
                  chat_id = os.environ.get('TELEGRAM_CHAT_ID')
                  title = os.environ.get('TITLE', 'No Title')

                  print(f'--- Đang gửi video đến Chat ID: {chat_id} ---')
                  video_path = 'out/video.mp4'
                  
                  with open(video_path, 'rb') as f:
                      r_tg = requests.post(
                          f'https://api.telegram.org/bot{token}/sendVideo',
                          data={'chat_id': chat_id, 'caption': '🚀 Test Render: ' + title},
                          files={'video': f}
                      )
                  
                  if r_tg.status_code == 200:
                      print('✅ Thành công! Kiểm tra Telegram của bạn.')
                  else:
                      print(f'❌ Lỗi Telegram: {r_tg.text}')
                      sys.exit(1)
                      
              except Exception as e:
                  print(f'❌ Lỗi hệ thống: {str(e)}')
                  sys.exit(1)
          run()
          "
