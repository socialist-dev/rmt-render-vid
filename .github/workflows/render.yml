name: Remotion Telegram Test
on:
  repository_dispatch:
    types: [render_video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 1. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 2. Install Dependencies
        run: |
          npm install
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 3. Render Remotion Video
        run: |
          npx remotion render MainVideo out/video.mp4 --props='${{ toJson(github.event.client_payload.video_data) }}'

      - name: 4. Send to Telegram Bot
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TITLE: ${{ github.event.client_payload.title }}
        run: |
          curl -v -F "chat_id=$TG_CHAT_ID" \
          -F "video=@out/video.mp4" \
          -F "caption=🚀 Render xong: $TITLE" \
          https://api.telegram.org/bot$TG_TOKEN/sendVideo
